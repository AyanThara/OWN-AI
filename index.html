<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG AI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #07070f;
  --card:   #0c0c18;
  --border: #151528;
  --cs:     #00d9ff;
  --math:   #b388ff;
  --food:   #ffb74d;
  --sports: #69f0ae;
  --accent: #6c63ff;
  --text:   #cdd6f4;
  --muted:  #4a4a6a;
  --red:    #f38ba8;
  --green:  #a6e3a1;
  --user-bubble: #1e90ff;
  --ai-bubble: #151528;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Fira Code', 'Courier New', monospace;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

/* ════════════════════════════════════════════════════════════
   HEADER / TOP BAR
   ════════════════════════════════════════════════════════════ */
header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 20px;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 3px;
  background: linear-gradient(90deg, var(--cs), var(--accent), var(--math));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-left: auto;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(108, 99, 255, 0.12);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 10px;
  color: var(--text);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.status-badge.offline .status-dot {
  background: var(--red);
}

/* ════════════════════════════════════════════════════════════
   TOP NAV TABS
   ════════════════════════════════════════════════════════════ */
.top-nav {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-shrink: 0;
  padding: 0 24px;
  gap: 24px;
}

.nav-tab {
  padding: 12px 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  transition: all 0.2s;
  text-transform: uppercase;
}

.nav-tab:hover {
  color: var(--accent);
}

.nav-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ════════════════════════════════════════════════════════════
   MAIN CONTENT AREA
   ════════════════════════════════════════════════════════════ */
.main-container {
  flex: 1;
  overflow: hidden;
  display: flex;
}

.tab-view {
  display: none;
  flex: 1;
  overflow: hidden;
  flex-direction: column;
}

.tab-view.active {
  display: flex;
}

/* ════════════════════════════════════════════════════════════
   CHAT TAB
   ════════════════════════════════════════════════════════════ */
#chatView {
  flex-direction: column;
}

.chat-wrapper {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.messages-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  display: flex;
  animation: msgFade 0.3s ease-out;
}

@keyframes msgFade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  justify-content: flex-end;
}

.message.ai {
  justify-content: flex-start;
}

.message-bubble {
  max-width: 70%;
  padding: 12px 16px;
  border-radius: 14px;
  line-height: 1.5;
  word-wrap: break-word;
  font-size: 12px;
}

.message.user .message-bubble {
  background: var(--user-bubble);
  color: white;
  border-radius: 18px 18px 4px 18px;
}

.message.ai .message-bubble {
  background: var(--ai-bubble);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 18px 18px 18px 4px;
}

.thinking {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
}

.spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.sources {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 9px;
  color: var(--muted);
}

.sources-label {
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  color: var(--accent);
}

.source-item {
  padding: 6px 8px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 4px;
  border-left: 2px solid var(--accent);
  margin-bottom: 4px;
  color: var(--text-secondary);
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--muted);
}

.empty-icon {
  font-size: 48px;
  opacity: 0.3;
}

.input-area {
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 16px 24px;
  flex-shrink: 0;
}

.input-wrapper {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.input-group {
  flex: 1;
  display: flex;
  gap: 8px;
}

textarea {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 12px;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  min-height: 40px;
  max-height: 100px;
  line-height: 1.4;
}

textarea:focus {
  border-color: var(--accent);
}

select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 8px;
  border-radius: 6px;
  font-size: 11px;
  outline: none;
  cursor: pointer;
}

button {
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

button:hover {
  background: var(--green);
  transform: translateY(-1px);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.chat-sidebar {
  width: 240px;
  background: var(--card);
  border-left: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ════════════════════════════════════════════════════════════
   DOCUMENTS TAB
   ════════════════════════════════════════════════════════════ */
#docsView {
  flex-direction: row;
  gap: 0;
}

.docs-container {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 20px;
  padding: 24px;
}

.docs-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
}

.section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}

.input-field {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 11px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}

.input-field:focus {
  border-color: var(--accent);
}

.doc-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.doc-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}

.doc-card {
  background: var(--ai-bubble);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  transition: all 0.2s;
}

.doc-card:hover {
  border-color: var(--accent);
  background: rgba(108, 99, 255, 0.08);
}

.doc-title {
  font-weight: 600;
  color: var(--green);
  font-size: 12px;
  margin-bottom: 4px;
}

.doc-meta {
  font-size: 10px;
  color: var(--muted);
}

.doc-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.doc-actions button {
  flex: 1;
  padding: 6px 8px;
  font-size: 10px;
}

/* ════════════════════════════════════════════════════════════
   GRAPH TAB
   ════════════════════════════════════════════════════════════ */
#graphView {
  flex-direction: row;
}

.graph-main {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#scatterCanvas {
  display: block;
  width: 100%;
  height: 100%;
}

.graph-sidebar {
  width: 280px;
  background: var(--card);
  border-left: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--accent);
  text-transform: uppercase;
}

.btn-row {
  display: flex;
  gap: 6px;
}

.btn-row button {
  flex: 1;
  padding: 8px 6px;
  font-size: 10px;
}

input[type="text"] {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 11px;
  outline: none;
  transition: border-color 0.2s;
}

input[type="text"]:focus {
  border-color: var(--accent);
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
  background: transparent;
}

.legend {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.stats-display {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-size: 10px;
  line-height: 1.6;
  color: var(--muted);
}

#tooltip {
  position: fixed;
  display: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 10px;
  pointer-events: none;
  max-width: 200px;
  z-index: 1000;
  line-height: 1.4;
}

/* ════════════════════════════════════════════════════════════
   SCROLLBARS
   ════════════════════════════════════════════════════════════ */
::-webkit-scrollbar {
  width: 4px;
  height: 4px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}

/* ════════════════════════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════════════════════════ */
@media (max-width: 1200px) {
  .chat-sidebar {
    width: 200px;
  }
  .graph-sidebar {
    width: 240px;
  }
}

@media (max-width: 768px) {
  header {
    flex-direction: column;
    align-items: flex-start;
    padding: 12px 16px;
  }
  .header-right {
    width: 100%;
    margin-left: 0;
  }
  .top-nav {
    padding: 0 16px;
    gap: 16px;
  }
  .nav-tab {
    padding: 10px 0;
    font-size: 11px;
  }
  .chat-sidebar {
    width: 100%;
    border-left: none;
    border-top: 1px solid var(--border);
    max-height: 30%;
  }
  .graph-sidebar {
    width: 100%;
    border-left: none;
    border-top: 1px solid var(--border);
    max-height: 30%;
  }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>🤖 RAG AI</h1>
  <div class="header-right">
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span>Connected</span>
    </div>
  </div>
</header>

<!-- TOP NAVIGATION TABS -->
<div class="top-nav">
  <div class="nav-tab active" onclick="switchView('chat')">
    💬 Chat
  </div>
  <div class="nav-tab" onclick="switchView('docs')">
    📄 Documents
  </div>
  <div class="nav-tab" onclick="switchView('graph')">
    📊 Graph
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-container">

  <!-- ══ CHAT TAB ══ -->
  <div class="tab-view active" id="chatView">
    <div class="chat-wrapper">
      <div class="chat-main">
        <div class="messages-area" id="messagesArea">
          <div class="empty-state">
            <div class="empty-icon">💬</div>
            <div>Start a conversation</div>
          </div>
        </div>
        <div class="input-area">
          <div class="input-wrapper">
            <div class="input-group">
              <textarea id="messageInput" placeholder="Ask a question..."></textarea>
              <select id="kSelector">
                <option value="2">Top 2</option>
                <option value="3" selected>Top 3</option>
                <option value="5">Top 5</option>
              </select>
            </div>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
      <div class="chat-sidebar">
        <div>
          <div class="section-title">Status</div>
          <div class="stats-display" id="ollamaStatus">
            Checking...
          </div>
        </div>
        <div>
          <div class="section-title">Conversation</div>
          <div style="font-size: 10px; color: var(--muted);">Messages will appear here</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ DOCUMENTS TAB ══ -->
  <div class="tab-view" id="docsView">
    <div class="docs-container">
      <div class="docs-panel" style="flex: 0 0 400px;">
        <div>
          <div class="section-title">Insert Document</div>
          <div class="doc-form">
            <input type="text" id="docTitle" class="input-field" placeholder="Document title..." />
            <textarea id="docText" class="input-field" style="min-height: 120px;" placeholder="Document content..."></textarea>
            <button id="insertDocBtn" onclick="insertDocument()" style="width: 100%;">⚡ Embed & Insert</button>
            <div id="insertStatus" style="font-size: 10px; color: var(--muted);"></div>
          </div>
        </div>
      </div>
      <div class="docs-panel" style="flex: 1;">
        <div>
          <div class="section-title">Stored Documents (<span id="docCount">0</span>)</div>
          <div class="doc-list" id="docList">
            <div style="color: var(--muted); font-size: 10px;">No documents yet</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ GRAPH TAB ══ -->
  <div class="tab-view" id="graphView">
    <div class="graph-main">
      <canvas id="scatterCanvas"></canvas>
    </div>
    <div class="graph-sidebar">
      <div>
        <div class="section-title">Search Query</div>
        <div class="control-group">
          <input type="text" id="qInput" placeholder="Search..." />
          <button onclick="runSearch()" style="width: 100%;">⚡ Search</button>
        </div>
      </div>
      <div>
        <div class="section-title">Algorithm</div>
        <div class="btn-row">
          <button class="algo-btn on" data-algo="hnsw" onclick="setAlgo(this)">HNSW</button>
          <button class="algo-btn" data-algo="kdtree" onclick="setAlgo(this)">KD</button>
          <button class="algo-btn" data-algo="bruteforce" onclick="setAlgo(this)">BF</button>
        </div>
      </div>
      <div>
        <div class="control-label">Metric</div>
        <select id="metric">
          <option value="cosine">Cosine</option>
          <option value="euclidean">Euclidean</option>
          <option value="manhattan">Manhattan</option>
        </select>
      </div>
      <div>
        <div class="control-label">Top-K: <span id="kLabel">5</span></div>
        <input type="range" id="kSlider" min="1" max="10" value="5" oninput="document.getElementById('kLabel').textContent=this.value" />
      </div>
      <div>
        <div class="section-title">Legend</div>
        <div class="legend">
          <div class="legend-row"><div class="legend-dot" style="background:var(--cs)"></div>CS</div>
          <div class="legend-row"><div class="legend-dot" style="background:var(--math)"></div>Math</div>
          <div class="legend-row"><div class="legend-dot" style="background:var(--food)"></div>Food</div>
          <div class="legend-row"><div class="legend-dot" style="background:var(--sports)"></div>Sports</div>
          <div class="legend-row"><div class="legend-dot" style="background:var(--green)"></div>Documents</div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="tooltip"></div>

<script>
const API = 'http://localhost:8080';
const DIMS = 16;
const COL = { cs:'#00d9ff', math:'#b388ff', food:'#ffb74d', sports:'#69f0ae', doc:'#a6e3a1', default:'#90a4ae' };

let allItems = [], pcaPoints = [], hitIds = new Set(), queryPt = null;
let hoverItem = null, pulse = 0, selAlgo = 'hnsw', isLoading = false;

// ════════════════════════════════════════════════════════════
// TAB SWITCHING
// ════════════════════════════════════════════════════════════
function switchView(viewName) {
  // Update nav tabs
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.classList.remove('active');
  });
  event.target.classList.add('active');
  
  // Update views
  document.querySelectorAll('.tab-view').forEach(view => {
    view.classList.remove('active');
  });
  document.getElementById(viewName + 'View').classList.add('active');
  
  // Initialize graph if needed
  if (viewName === 'graph') {
    setTimeout(() => {
      resize();
      if (!pcaPoints.length) loadItems();
    }, 100);
  }
  
  // Load docs if needed
  if (viewName === 'docs') {
    loadDocList();
  }
}

// ════════════════════════════════════════════════════════════
// EMBEDDING & PCA
// ════════════════════════════════════════════════════════════
const KW = {
  cs: ['algorithm','data','tree','graph','array','linked','hash','stack','queue','sort','binary','dynamic','programming','recursion','complexity'],
  math: ['calculus','matrix','probability','theorem','integral','derivative','linear','algebra','equation','function','prime'],
  food: ['food','pizza','sushi','ramen','pasta','recipe','cook','eat','restaurant','dish'],
  sports: ['sport','basketball','football','tennis','chess','swim','game','play','score','team']
};

function textToEmbedding(text) {
  const t = text.toLowerCase(), ws = t.split(/\s+/);
  const s = {cs:0,math:0,food:0,sports:0};
  for (const w of ws)
    for (const [cat, kws] of Object.entries(KW))
      for (const kw of kws) if (w.includes(kw)) { s[cat]+=0.35; break; }
  const mx = Math.max(...Object.values(s), 0.01);
  const n = v => Math.min(v/mx*0.88, 0.94);
  const emb = new Array(16).fill(0.08);
  const fill = (i,score) => {
    if (score<.01) return;
    const b = n(score);
    emb[i]=Math.max(.05,b+(Math.random()-.5)*.04);
    emb[i+1]=Math.max(.05,b+(Math.random()-.5)*.04);
  };
  fill(0,s.cs); fill(4,s.math); fill(8,s.food); fill(12,s.sports);
  return emb;
}

function pca2D(embs) {
  const n = embs.length, d = embs[0].length;
  if (n < 2) return embs.map(() => [0,0]);
  const mean = new Array(d).fill(0);
  for (const e of embs) for (let i=0;i<d;i++) mean[i]+=e[i]/n;
  const X = embs.map(e => e.map((v,i)=>v-mean[i]));
  function powerIter(X,excl) {
    let v = new Array(d).fill(0).map(()=>Math.random()-.5);
    if (excl) { let dot=v.reduce((s,vi,i)=>s+vi*excl[i],0); v=v.map((vi,i)=>vi-dot*excl[i]); }
    let nrm = Math.sqrt(v.reduce((s,vi)=>s+vi*vi,0));
    v = v.map(vi=>vi/nrm);
    for (let it=0;it<200;it++) {
      const Xv=X.map(xi=>xi.reduce((s,xij,j)=>s+xij*v[j],0));
      const nv=new Array(d).fill(0);
      for (let k=0;k<n;k++) for (let j=0;j<d;j++) nv[j]+=X[k][j]*Xv[k];
      if (excl) { let dot=nv.reduce((s,vi,i)=>s+vi*excl[i],0); for (let i=0;i<d;i++) nv[i]-=dot*excl[i]; }
      nrm=Math.sqrt(nv.reduce((s,vi)=>s+vi*vi,0));
      if (nrm<1e-10) break;
      const prev=v.slice(); v=nv.map(vi=>vi/nrm);
      if (v.reduce((s,vi,i)=>s+(vi-prev[i])**2,0)<1e-12) break;
    }
    return v;
  }
  const pc1=powerIter(X,null), pc2=powerIter(X,pc1);
  return X.map(x=>[x.reduce((s,v,i)=>s+v*pc1[i],0),x.reduce((s,v,i)=>s+v*pc2[i],0)]);
}

// ════════════════════════════════════════════════════════════
// CANVAS / VISUALIZATION
// ════════════════════════════════════════════════════════════
const canvas = document.getElementById('scatterCanvas');
const ctx = canvas.getContext('2d');
let bounds = {minX:-1,maxX:1,minY:-1,maxY:1};

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}

function w2c(wx, wy) {
  const P=70, W=canvas.width, H=canvas.height;
  const rx=bounds.maxX-bounds.minX||1, ry=bounds.maxY-bounds.minY||1;
  return [P+((wx-bounds.minX)/rx)*(W-2*P), H-P-((wy-bounds.minY)/ry)*(H-2*P)];
}

function drawFrame() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#07070f'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#0e0e1e'; ctx.lineWidth=1;
  for (let i=0;i<=8;i++) {
    const tx=70+(i/8)*(canvas.width-140), ty=70+(i/8)*(canvas.height-140);
    ctx.beginPath(); ctx.moveTo(tx,70); ctx.lineTo(tx,canvas.height-70); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(70,ty); ctx.lineTo(canvas.width-70,ty); ctx.stroke();
  }
  
  ctx.fillStyle='#1a1a38'; ctx.font='11px Fira Code';
  ctx.fillText('PC₁ →',canvas.width/2-40,canvas.height-18);
  ctx.save(); ctx.translate(18,canvas.height/2+50); ctx.rotate(-Math.PI/2);
  ctx.fillText('PC₂ →',0,0); ctx.restore();
  
  if (queryPt && hitIds.size>0) {
    const [qx,qy]=w2c(queryPt.x,queryPt.y);
    for (const pt of pcaPoints) {
      if (!hitIds.has(pt.item.id)) continue;
      const [px,py]=w2c(pt.x,pt.y);
      ctx.strokeStyle='rgba(108,99,255,0.2)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(qx,qy); ctx.lineTo(px,py); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  
  for (const pt of pcaPoints) {
    const [cx,cy]=w2c(pt.x,pt.y);
    const col=COL[pt.item.category]||COL.default;
    const isHit=hitIds.has(pt.item.id), r=isHit?10:7;
    if (isHit) {
      const pr=r+7+Math.sin(pulse)*3;
      ctx.beginPath(); ctx.arc(cx,cy,pr,0,2*Math.PI);
      ctx.strokeStyle=col+'44'; ctx.lineWidth=1; ctx.stroke();
    }
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.5);
    grd.addColorStop(0,col+(isHit?'88':'55')); grd.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.arc(cx,cy,r*2.5,0,2*Math.PI); ctx.fillStyle=grd; ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.fillStyle=col; ctx.fill();
  }
  
  if (queryPt) {
    const [qx,qy]=w2c(queryPt.x,queryPt.y);
    ctx.save(); ctx.translate(qx,qy); ctx.shadowColor='#fff'; ctx.shadowBlur=12;
    ctx.beginPath();
    for (let i=0;i<10;i++) {
      const a=(i*Math.PI/5)-Math.PI/2, rr=i%2===0?11:4;
      if(i===0) ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
      else ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
  }
  
  pulse += 0.05;
  requestAnimationFrame(drawFrame);
}

canvas.addEventListener('mousemove', e => {
  const rect=canvas.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  hoverItem=null; let best=18;
  for (const pt of pcaPoints) {
    const [cx,cy]=w2c(pt.x,pt.y), d=Math.hypot(mx-cx,my-cy);
    if (d<best) { best=d; hoverItem=pt.item; }
  }
  const tip=document.getElementById('tooltip');
  if (hoverItem) {
    const col=COL[hoverItem.category]||COL.default;
    tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px';
    tip.innerHTML=`<span style="color:${col}">[${hoverItem.category}]</span><br>${hoverItem.metadata}`;
  } else tip.style.display='none';
});

// ════════════════════════════════════════════════════════════
// GRAPH OPERATIONS
// ════════════════════════════════════════════════════════════
async function loadItems() {
  try {
    const r = await fetch(API+'/items');
    allItems = await r.json();
    if (allItems.length >= 2) {
      const coords = pca2D(allItems.map(v=>v.embedding));
      pcaPoints = allItems.map((item,i)=>({x:coords[i][0],y:coords[i][1],item}));
      let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
      for (const p of pcaPoints){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
      const px=(x1-x0)*.15||.1, py=(y1-y0)*.15||.1;
      bounds={minX:x0-px,maxX:x1+px,minY:y0-py,maxY:y1+py};
    }
  } catch(_) {}
}

function setAlgo(el) {
  document.querySelectorAll('.algo-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on'); selAlgo=el.dataset.algo;
}

async function runSearch() {
  const text=document.getElementById('qInput').value.trim(); if(!text)return;
  const emb=textToEmbedding(text), k=parseInt(document.getElementById('kSlider').value);
  const metric=document.getElementById('metric').value;
  try {
    const r=await fetch(`${API}/search?v=${emb.join(',')}&k=${k}&metric=${metric}&algo=${selAlgo}`);
    const data=await r.json();
    hitIds=new Set((data.results||[]).map(r=>r.id));
    if (data.results?.length>0){
      let sx=0,sy=0,sw=0;
      for (let i=0;i<Math.min(3,data.results.length);i++){
        const pt=pcaPoints.find(p=>p.item.id===data.results[i].id);
        if(pt){const w=1/(i+1);sx+=pt.x*w;sy+=pt.y*w;sw+=w;}
      }
      if(sw>0)queryPt={x:sx/sw+(Math.random()-.5)*.01,y:sy/sw+(Math.random()-.5)*.01};
    }
  } catch(_){}
}

// ════════════════════════════════════════════════════════════
// CHAT OPERATIONS
// ════════════════════════════════════════════════════════════
const messagesArea = document.getElementById('messagesArea');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const kSelector = document.getElementById('kSelector');

messageInput.addEventListener('input', () => {
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
});

messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function scrollChat() {
  setTimeout(() => messagesArea.scrollTop = messagesArea.scrollHeight, 0);
}

function addMessage(text, isUser = false) {
  if (messagesArea.querySelector('.empty-state')) {
    messagesArea.innerHTML = '';
  }
  const msg = document.createElement('div');
  msg.className = `message ${isUser ? 'user' : 'ai'}`;
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  messagesArea.appendChild(msg);
  scrollChat();
}

function addSources(sources) {
  if (!sources?.length) return;
  const lastMsg = messagesArea.lastChild;
  if (!lastMsg) return;
  const src = document.createElement('div');
  src.className = 'sources';
  src.innerHTML = '<div class="sources-label">📚 Sources</div>' +
    sources.map((s,i) => `<div class="source-item">#${i+1} ${s.title}</div>`).join('');
  lastMsg.appendChild(src);
}

function addThinking() {
  const msg = document.createElement('div');
  msg.className = 'message ai';
  msg.id = 'thinkingMsg';
  msg.innerHTML = '<div class="message-bubble thinking"><div class="spinner"></div><span>Thinking...</span></div>';
  messagesArea.appendChild(msg);
  scrollChat();
}

function removeThinking() {
  const el = document.getElementById('thinkingMsg');
  if (el) el.remove();
}

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || isLoading) return;
  messageInput.value = '';
  messageInput.style.height = 'auto';
  isLoading = true;
  sendBtn.disabled = true;
  addMessage(text, true);
  addThinking();
  const k = parseInt(kSelector.value);
  try {
    const res = await fetch(API + '/doc/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, k })
    });
    const data = await res.json();
    removeThinking();
    if (data.error) {
      addMessage(`Error: ${data.error}`);
    } else {
      addMessage(data.answer);
      addSources(data.contexts);
      if (data.contexts?.length) {
        hitIds = new Set();
        let sx=0,sy=0,sw=0;
        data.contexts.forEach((c,i) => {
          const pt = pcaPoints.find(p => p.item.category === 'doc');
          if (pt) { hitIds.add(pt.item.id); const w=1/(i+1); sx+=pt.x*w; sy+=pt.y*w; sw+=w; }
        });
        if (sw>0) queryPt = {x: sx/sw+(Math.random()-.5)*.01, y: sy/sw+(Math.random()-.5)*.01};
      }
    }
  } catch(_) {
    removeThinking();
    addMessage('Connection error');
  }
  isLoading = false;
  sendBtn.disabled = false;
  messageInput.focus();
}

// ════════════════════════════════════════════════════════════
// DOCUMENT OPERATIONS
// ════════════════════════════════════════════════════════════
async function checkStatus() {
  try {
    const r = await fetch(API + '/status');
    const d = await r.json();
    const badge = document.getElementById('statusBadge');
    const status = document.getElementById('ollamaStatus');
    if (d.ollamaAvailable) {
      badge.classList.remove('offline');
      status.innerHTML = `<span style="color:var(--green)">● Online</span><br>Model: ${d.genModel}`;
    } else {
      badge.classList.add('offline');
      status.innerHTML = `<span style="color:var(--red)">● Offline</span><br>Install Ollama to enable`;
    }
  } catch(_) {}
}

async function insertDocument() {
  const title = document.getElementById('docTitle').value.trim();
  const text = document.getElementById('docText').value.trim();
  const btn = document.getElementById('insertDocBtn');
  const status = document.getElementById('insertStatus');
  if (!title || !text) { status.textContent = '⚠ Need title and text'; return; }
  btn.disabled = true;
  status.textContent = 'Processing...';
  try {
    const r = await fetch(API + '/doc/insert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, text })
    });
    const d = await r.json();
    if (d.error) {
      status.textContent = '✗ ' + d.error;
    } else {
      status.textContent = `✓ Inserted ${d.chunks} chunks`;
      document.getElementById('docTitle').value = '';
      document.getElementById('docText').value = '';
      const emb = textToEmbedding(title + ' ' + text);
      fetch(API + '/insert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ metadata: title, category: 'doc', embedding: emb })
      }).then(() => loadItems());
      loadDocList();
    }
  } catch(_) {
    status.textContent = '✗ Error';
  }
  btn.disabled = false;
}

async function loadDocList() {
  try {
    const r = await fetch(API + '/doc/list');
    const docs = await r.json();
    document.getElementById('docCount').textContent = docs.length;
    const list = document.getElementById('docList');
    if (!docs.length) {
      list.innerHTML = '<div style="color: var(--muted); font-size: 10px;">No documents</div>';
      return;
    }
    list.innerHTML = docs.map(d => `
      <div class="doc-card">
        <div class="doc-title">${d.title}</div>
        <div class="doc-meta">${d.words} words</div>
        <div class="doc-actions">
          <button onclick="deleteDoc(${d.id})" style="flex:1;padding:6px;background:var(--red);opacity:0.7;">Delete</button>
        </div>
      </div>
    `).join('');
  } catch(_) {}
}

async function deleteDoc(id) {
  try {
    await fetch(`${API}/doc/delete/${id}`, { method: 'DELETE' });
    loadDocList();
  } catch(_) {}
}

  if (document.getElementById('graphView').classList.contains('active')) {
    resize();

resize();
drawFrame();
loadItems();
checkStatus();
